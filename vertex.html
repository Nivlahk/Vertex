      try {
        const res = await fetch(sv);
        const ct = res.headers.get('content-type') || '';
        if (ct.includes('application/json')) return await res.json();
        return await res.text();
      } catch (e) {
        throw new RuntimeError(`fetch failed for ${sv}: ${e.message}`, node.line);
      }
    }
    return sv;
  }

  async _evalBoolLit(node) {
    return node.value;
  }



  // ── Execute a program from source ─────────────────────────────────────────
  async run(source, options = {}) {
    let parsed;
    try {
      parsed = parse(source);
    } catch (e) {
      console.error("[IVX] Parse crash:", e);
      this.onError(new RuntimeError(`Parser crashed: ${e.message}`, 0));
      return;
    }
    const { errors: typeErrors } = typecheck(parsed);

    const hasParseErrors = parsed.errors.length > 0;
    if (typeErrors.length > 0 && (hasParseErrors || !options.ignoreTypeErrors)) {
      for (const e of typeErrors) this.onError(e);
      return;
    }
    // Infer immutable variables before execution
    this._immutables = inferImmutables(parsed.ast);
    try {
      await this.execBlock(parsed.ast.body, this.globals);
    } catch (e) {
      if (e instanceof RuntimeError) this.onError(e);
      else throw e;
    }
  }

  _resolveClassObject(name, env = this.globals) {
    const value = env?.get?.(name);
    return value instanceof IVXClass ? value : null;
  }

  _bindMethod(methodFn, selfValue) {
    const bound = new IVXFunction(methodFn.name, methodFn.params, methodFn.body, methodFn.closure);
    bound.__ownerClass = methodFn.__ownerClass ?? null;
    bound.__boundSelf = selfValue;

    const ownerClass = methodFn.__ownerClass ?? null;
    if (ownerClass?.superclass) {
      bound.__boundSuper = new IVXSuperProxy(selfValue, ownerClass);
    }

    return bound;
  }

  _resolveInstanceMember(instance, field, selfValue = instance) {
    if (!(instance instanceof Map)) return NONE;
    if (instance.has(field)) return instance.get(field);

    const classObj = instance.get('__class_obj__');
    const method = classObj?.resolveMethod?.(field) ?? null;
    if (method) {
      return this._bindMethod(method, selfValue);
    }

    return NONE;
  }

  _resolveSuperMember(proxy, field) {
    if (!(proxy instanceof IVXSuperProxy)) return NONE;
    const superClass = proxy.ownerClass?.superclass ?? null;
    const method = superClass?.resolveMethod?.(field) ?? null;
    if (method) return this._bindMethod(method, proxy.self);
    return NONE;
  }

  // ── Built-in functions ────────────────────────────────────────────────────
  _registerBuiltins() {
    const G = this.globals;
    for (const [name, spec] of Object.entries(BUILTIN_DEFS)) {
      G.set(name, new IVXFunction(name, spec.params, null, null));
    }
  }

  // ── Call a built-in function by name ──────────────────────────────────────
  _callBuiltin(name, args, node) {
    const spec = BUILTIN_DEFS[name];
    if (!spec) throw new RuntimeError(`Unknown built-in '${name}'`, node?.line);
    return spec.call(args, node, this);
  }


  // ── I/O delegation — all side effects live in IVXRuntime ─────────────────
  async _executePost(node, env, opts) { return this.runtime._executePost(node, env, opts); }
  async _executeGet(node, env) { return this.runtime._executeGet(node, env); }
  async _saveLocalFile(f, c, m) { return this.runtime._saveLocalFile(f, c, m); }
  async _saveDriveFile(f, c, m) { return this.runtime._saveDriveFile(f, c, m); }
  _ivxToPlain(v) { return this.runtime._ivxToPlain(v); }
  _escapeDelimitedCell(v, d) { return this.runtime._escapeDelimitedCell(v, d); }
  _toDelimitedText(v, d) { return this.runtime._toDelimitedText(v, d); }
  _serializeForSave(v, f) { return this.runtime._serializeForSave(v, f); }
  async _evalAskExpr(node, env) { return this.runtime._evalAskExpr(node, env); }
  async _evalSheetsOpenExpr(node, env) { return this.runtime._evalSheetsOpenExpr(node, env); }
  async _executeWaitBlock(node, env) { return this.runtime._executeWaitBlock(node, env); }


  async _evalListLit(node, env) {
    const elements = [];
    for (const el of node.elements) elements.push(await this.evalExpr(el, env));
    return elements;
  }

  async _evalDictLit(node, env) {
    const map = new Map();
    for (const { key, value } of node.pairs) {
      const k = await this.evalExpr(key, env);
      const v = await this.evalExpr(value, env);
      map.set(k, v);
    }
    return map;
  }

  async _evalMemberAccessExpr(node, env) {
    const target = await this.evalExpr(node.object, env);
    if (target instanceof IVXSuperProxy) {
      return this._resolveSuperMember(target, node.field);
    }
    if (target instanceof Map) {
      return this._resolveInstanceMember(target, node.field, target);
    }
    if (target && typeof target === 'object') {
      return node.field in target ? target[node.field] : NONE;
    }
    return NONE;
  }

  async _evalSuperExpr(node, env) {
    const target = env.get('super');
    if (target instanceof IVXSuperProxy) return target;
    throw new RuntimeError(`'super' is only available inside a subclass method`, node.line, node.col);
  }

  async _evalIdentifierExpr(node, env) {
    const val = env.get(node.name);
    if (val === undefined) {
      throw new RuntimeError(`'${node.name}' isn't defined yet — did you mean to make it first?`, node.line, node.col);
    }
    return val;
  }

  async _evalInvokeExpr(node, env) {
    const callee = await this.evalExpr(node.callee, env);
    const args = [];
    for (const arg of node.args) args.push(await this.evalExpr(arg, env));
    



    if (callee instanceof IVXFunction) {
      if (callee.body === null) {
        try {
          return await this._callBuiltin(callee.name, args, node) ?? NONE;
        } catch (e) {
          this.globals.set('err', e.message ?? String(e));
          return NONE;
        }
      }
      const fnEnv = callee.closure.child();
      if (callee.__boundSelf !== undefined) {
        fnEnv.set('self', callee.__boundSelf);
      }
      if (callee.__boundSuper !== undefined) {
        fnEnv.set('super', callee.__boundSuper);
      }
      for (let i = 0; i < callee.params.length; i++) {
        const { name: pn, value: pv } = await resolveParam(callee.params[i], args[i], fnEnv, this);
        fnEnv.set(pn, pv);
      }
      try {
        const result = await this.execBlock(callee.body, fnEnv);
        if (result instanceof ReturnSignal) return result.value;
        return NONE;
      } catch (e) {
        this.globals.set('err', e.message ?? String(e));
        return NONE;
      }
    }

    if (callee instanceof IVXClass) {
      try {
        return await callee.instantiate(args, this, node);
      } catch (e) {
        this.globals.set('err', e.message ?? String(e));
        return NONE;
      }
    }

    // Native async functions stored in Maps (e.g. sheets handle methods)
    if (typeof callee === 'function') {
      try {
        return await callee(...args) ?? NONE;
      } catch (e) {
        if (e instanceof RuntimeError) throw e;
        throw new RuntimeError(e.message ?? String(e), node.line);
      }
    }

    throw new RuntimeError('Attempted to call a non-callable value', node.line);
  }

  _toArrayIndex(value, node, label) {
    const n = Number(value);
    if (!Number.isFinite(n) || !Number.isInteger(n)) {
      throw new RuntimeError(`${label} index must be an integer`, node?.line);
    }
    return n;
  }

  _toSliceBound(value, node, label) {
    if (value === null || value === undefined) return null;
    return this._toArrayIndex(value, node, label);
  }

  _toExcelColumnIndex(value) {
    if (typeof value !== 'string') return null;
    const col = value.trim().toUpperCase();
    if (!/^[A-Z]+$/.test(col)) return null;
    let out = 0;
    for (let i = 0; i < col.length; i++) {
      out = out * 26 + (col.charCodeAt(i) - 64);
    }
    return out - 1;
  }

  _parseExcelCellRef(value) {
    if (typeof value !== 'string') return null;
    const m = value.trim().toUpperCase().match(/^([A-Z]+)(\d+)$/);
    if (!m) return null;
    const col = this._toExcelColumnIndex(m[1]);
    const row = Number(m[2]);
    if (col == null || !Number.isInteger(row) || row < 0) return null;
    return { row, col };
  }

  _normalizeTableColumnSelector(value, node) {
    if (typeof value !== 'string') return value;
    const colIdx = this._toExcelColumnIndex(value);
    if (colIdx == null) {
      throw new RuntimeError(`Invalid table column '${value}'. Use Excel letters like A, B, AA`, node?.line);
    }
    return colIdx;
  }

  _sliceExcelRange(table, startRef, endRef) {
    const rowStart = Math.min(startRef.row, endRef.row);
    const rowEnd = Math.max(startRef.row, endRef.row);
    const colStart = Math.min(startRef.col, endRef.col);
    const colEnd = Math.max(startRef.col, endRef.col);
    const out = [];

    for (let r = rowStart; r <= rowEnd; r++) {
      const rowVal = table[r] ?? NONE;
      if (Array.isArray(rowVal)) {
        out.push(rowVal.slice(colStart, colEnd + 1));
      } else if (rowVal instanceof Map) {
        const rowOut = [];
        for (let c = colStart; c <= colEnd; c++) rowOut.push(rowVal.get(c) ?? NONE);
        out.push(rowOut);
      } else if (rowVal && typeof rowVal === 'object') {
        const rowOut = [];
        for (let c = colStart; c <= colEnd; c++) rowOut.push(rowVal[c] ?? NONE);
        out.push(rowOut);
      } else {
        out.push([]);
      }
    }

    return out;
  }

  _pickColumnFromRow(row, colIdxOrKey) {
    if (row == null) return NONE;
    if (row instanceof Map) {
      return row.has(colIdxOrKey) ? row.get(colIdxOrKey) : NONE;
    }
    if (Array.isArray(row)) {
      if (typeof colIdxOrKey === 'string') return NONE;
      return row[colIdxOrKey] ?? NONE;
    }
    if (typeof row === 'object') {
      return row[colIdxOrKey] ?? NONE;
    }
    return NONE;
  }

  _sliceColumnsFromRow(row, start, end) {
    if (Array.isArray(row)) return row.slice(start ?? undefined, end ?? undefined);
    return NONE;
  }

  async _resolveIndexSpec(spec, env, node, label, { allowString = false } = {}) {
    if (!spec || spec.omitted) return { omitted: true, isSlice: false, value: null, start: null, end: null };
    if (spec.isSlice) {
      const startRaw = spec.start ? await this.evalExpr(spec.start, env) : null;
      const endRaw = spec.end ? await this.evalExpr(spec.end, env) : null;

      const start = allowString && typeof startRaw === 'string'
        ? startRaw
        : this._toSliceBound(startRaw, node, `${label} start`);
      const end = allowString && typeof endRaw === 'string'
        ? endRaw
        : this._toSliceBound(endRaw, node, `${label} end`);

      return {
        omitted: false,
        isSlice: true,
        start,
        end,
      };
    }

    const raw = spec.expr ? await this.evalExpr(spec.expr, env) : null;
    if (allowString && typeof raw === 'string') {
      return { omitted: false, isSlice: false, value: raw, start: null, end: null };
    }
    return { omitted: false, isSlice: false, value: this._toArrayIndex(raw, node, label), start: null, end: null };
  }

  async _evalIndexAccessExpr(node, env) {
    const target = await this.evalExpr(node.target, env);
    const isArrayTarget = Array.isArray(target);

    const isSheet = target instanceof Map && target.get('__type__') === 'sheets';
    const row = await this._resolveIndexSpec(node.rowSpec, env, node, 'Row', { allowString: isArrayTarget || isSheet });
    const col = await this._resolveIndexSpec(node.colSpec, env, node, 'Column', { allowString: true });


    if (!isArrayTarget) {
      if (node.hasComma) {
        throw new RuntimeError(`2D indexing requires a list target`, node.line);
      }
      if (row.omitted) return target;

      if (row.isSlice) {
        // Magic: sheets_handle[A1:B10] -> handle.read("A1:B10")
        if (target instanceof Map && target.get('__type__') === 'sheets') {
          const range = `${row.start}:${row.end}`;
          return await target.get('read')(range);
        }
        if (typeof target === 'string') {
          return target.slice(row.start ?? undefined, row.end ?? undefined);
        }
        throw new RuntimeError(`Slice indexing requires list or string target`, node.line);
      }

      if (target instanceof Map) {
        // Magic: sheets_handle[A1] -> handle.read("A1")
        if (target.get('__type__') === 'sheets' && !target.has(row.value)) {
          const res = await target.get('read')(row.value);
          // If it's a single cell, unwrap it
          if (Array.isArray(res) && res.length === 1 && Array.isArray(res[0]) && res[0].length === 1) {
            return res[0][0];
          }
          // If it's a 1D column/row, return it as a flat list
          if (Array.isArray(res) && res.length === 1) return res[0];
          if (Array.isArray(res) && res.every(r => Array.isArray(r) && r.length === 1)) return res.map(r => r[0]);
          return res;
        }
        return target.has(row.value) ? target.get(row.value) : NONE;
      }

      if (typeof target === 'object' && target !== null) {
        return target[row.value] ?? NONE;
      }
      if (typeof target === 'string') {
        const idx = this._toArrayIndex(row.value, node, 'Index');
        return target[idx] ?? NONE;
      }
      throw new RuntimeError(`Indexing requires a list/dict/string target`, node.line);
    }

    if (!node.hasComma) {
      if (row.omitted) return target;
      if (row.isSlice) {
        const startRef = this._parseExcelCellRef(row.start);
        const endRef = this._parseExcelCellRef(row.end);
        if (startRef && endRef) {
          return this._sliceExcelRange(target, startRef, endRef);
        }
        return target.slice(row.start ?? undefined, row.end ?? undefined);
      }
      if (typeof row.value === 'string') {
        const cell = this._parseExcelCellRef(row.value);
        if (cell) {
          const tableRow = target[cell.row];
          return this._pickColumnFromRow(tableRow, cell.col);
        }
      }
      return target[row.value] ?? NONE;
    }

    // t[,] -> whole table
    if (row.omitted && col.omitted) return target;

    // Build selected row set first.
    let selectedRows;
    if (row.omitted) {
      selectedRows = target.slice();
    } else if (row.isSlice) {
      selectedRows = target.slice(row.start ?? undefined, row.end ?? undefined);
    } else {
      selectedRows = [target[row.value] ?? NONE];
    }

    // Row-only access in 2D form: t[r,] or t[r1:r2,]
    if (col.omitted) {
      if (!row.omitted && !row.isSlice) return selectedRows[0] ?? NONE;
      return selectedRows;
    }

    // Column slices: t[,c1:c2], t[r,c1:c2], t[r1:r2,c1:c2]
    if (col.isSlice) {
      const cStart = this._normalizeTableColumnSelector(col.start, node);
      const cEnd = this._normalizeTableColumnSelector(col.end, node);
      const projected = selectedRows.map(r => this._sliceColumnsFromRow(r, cStart, cEnd));
      if (!row.omitted && !row.isSlice) return projected[0] ?? NONE;
      return projected;
    }

    // Single column projection: t[,c], t[r,c], t[r1:r2,c]
    const colSelector = this._normalizeTableColumnSelector(col.value, node);
    const projected = selectedRows.map(r => this._pickColumnFromRow(r, colSelector));
    if (!row.omitted && !row.isSlice) return projected[0] ?? NONE;
    return projected;
  }

  async _evalLazyDeclExpr(node) {
    if (!this.globals.has(node.name)) {
      this.globals.set(node.name, NONE);
    }
    return this.globals.get(node.name);
  }

  async _evalPostExpr(node, env) {
    return await this._executePost(node, env);
  }

  async _evalGetExpr(node, env) {
    return await this.runtime._executeGet(node, env);
  }

  async _evalUnaryOpExpr(node, env) {
    const operand = await this.evalExpr(node.operand, env);
    if (node.op === 'not') return Number.isInteger(operand) ? ~operand : !isTruthy(operand);
    return operand;
  }

  // ── Binary operations ──────────────────────────────────────────────────────
  async evalBinOp(node, env) {
    // Lazy inference: if either side is a LazyDecl, infer default from the other side
    if (node.left?.type === 'LazyDecl' || node.right?.type === 'LazyDecl') {
      const lazyNode = node.left?.type === 'LazyDecl' ? node.left : node.right;
      const otherNode = node.left?.type === 'LazyDecl' ? node.right : node.left;
      if (!this.globals.has(lazyNode.name)) {
        const otherVal = await this.evalExpr(otherNode, env);
        const defaultVal =
          typeof otherVal === 'number' && Number.isInteger(otherVal) ? 0
            : typeof otherVal === 'number' ? 0.0
              : typeof otherVal === 'string' ? ''
                : typeof otherVal === 'boolean' ? false
                  : NONE;
        this.globals.set(lazyNode.name, defaultVal);
      }
    }

    // Short-circuit for logical operators
    // If both sides are integers, use bitwise ops instead of boolean
    if (node.op === 'and') {
      const l = await this.evalExpr(node.left, env);
      if (!isTruthy(l)) return Number.isInteger(l) ? 0 : false;
      const r = await this.evalExpr(node.right, env);
      return (Number.isInteger(l) && Number.isInteger(r)) ? (l & r) : isTruthy(r);
    }
    if (node.op === 'or') {
      const l = await this.evalExpr(node.left, env);
      const r = await this.evalExpr(node.right, env);
      return (Number.isInteger(l) && Number.isInteger(r)) ? (l | r) : (isTruthy(l) || isTruthy(r));
    }
    if (node.op === 'nand') {
      const l = await this.evalExpr(node.left, env);
      const r = await this.evalExpr(node.right, env);
      return (Number.isInteger(l) && Number.isInteger(r)) ? ~(l & r) : !(isTruthy(l) && isTruthy(r));
    }
    if (node.op === 'nor') {
      const l = await this.evalExpr(node.left, env);
      const r = await this.evalExpr(node.right, env);
      return (Number.isInteger(l) && Number.isInteger(r)) ? ~(l | r) : !(isTruthy(l) || isTruthy(r));
    }

    const left = await this.evalExpr(node.left, env);
    const right = await this.evalExpr(node.right, env);

    // Element-wise broadcasting: list op scalar, scalar op list, or list op list
    const ARITH = new Set(['+', '-', '*', '/', '//', '%', '^']);
    if (ARITH.has(node.op)) {
      const leftArr = Array.isArray(left);
      const rightArr = Array.isArray(right);
      if (leftArr || rightArr) {
        const applyOp = (a, b) => {
          switch (node.op) {
            case '+': return a + b;
            case '&': return String(a) + String(b);
            case '-': return a - b;
            case '*': return a * b;
            case '/': return b === 0 ? NONE : a / b;
            case '//': return b === 0 ? NONE : Math.trunc(a / b);
            case '%': return a % b;
            case '^': return Math.pow(a, b);
            default: return NONE;
          }
        };
        if (leftArr && rightArr) {
          const len = Math.min(left.length, right.length);
          return Array.from({ length: len }, (_, i) => {
            const a = left[i], b = right[i];
            // 2D: both elements are rows → recurse element-wise on the rows
            if (Array.isArray(a) && Array.isArray(b)) {
              const rowLen = Math.min(a.length, b.length);
              return Array.from({ length: rowLen }, (_, j) => applyOp(a[j], b[j]));
            }
            if (Array.isArray(a)) return a.map(v => applyOp(v, b));
            if (Array.isArray(b)) return b.map(v => applyOp(a, v));
            return applyOp(a, b);
          });
        }
        if (leftArr) return left.map(v => Array.isArray(v) ? v.map(c => applyOp(c, right)) : applyOp(v, right));
        if (rightArr) return right.map(v => Array.isArray(v) ? v.map(c => applyOp(left, c)) : applyOp(left, v));
      }
    }

    switch (node.op) {
      case '+': return left + right;
      case '&': return String(left) + String(right);
      case '-': return left - right;
      case '*': return left * right;
      case '/': if (right === 0) throw new RuntimeError('Division by zero', node.line);
        return left / right;
      case '//': if (right === 0) throw new RuntimeError('Division by zero', node.line);
        return Math.trunc(left / right);
      case '%': return left % right;
      case '^': return Math.pow(left, right);
      case '=': return ivxEqual(left, right);
      case '!=': return !ivxEqual(left, right);
      case '<': return left < right;
      case '>': return left > right;
      case '<=': return left <= right;
      case '>=': return left >= right;
      case 'is': return ivxEqual(left, right);
      case 'in': return ivxIn(left, right, node);
      case 'not in': return !ivxIn(left, right, node);

      case 'same': return (Number.isInteger(left) && Number.isInteger(right)) ? ~(left ^ right) : isTruthy(left) === isTruthy(right);
      case 'xor': return (Number.isInteger(left) && Number.isInteger(right)) ? (left ^ right) : isTruthy(left) !== isTruthy(right);
      case 'nand': return (Number.isInteger(left) && Number.isInteger(right)) ? ~(left & right) : !(isTruthy(left) && isTruthy(right));
      case 'nor': return (Number.isInteger(left) && Number.isInteger(right)) ? ~(left | right) : !(isTruthy(left) || isTruthy(right));
      default: throw new RuntimeError(`Unknown operator '${node.op}'`, node.line);
    }
  }

  // ── Function calls ─────────────────────────────────────────────────────────
  async evalCall(node, env) {
    const callee = env.get(node.name);

    // Evaluate arguments
    const args = [];
    for (const arg of node.args) args.push(await this.evalExpr(arg, env));

    if (!(callee instanceof IVXFunction) && !(callee instanceof IVXClass)) {
      throw new RuntimeError(`'${node.name}' is not callable`, node.line);
    }

    if (callee instanceof IVXClass) {
      try {
        return await callee.instantiate(args, this, node);
      } catch (e) {
        this.globals.set('err', e.message ?? String(e));
        return NONE;
      }
    }

    // Built-in: body is null, delegate to _callBuiltin
    if (callee.body === null) {
      try {
        const res = await this._callBuiltin(node.name, args, node);
        return res ?? NONE;
      } catch (e) {
        this.globals.set('err', e.message ?? String(e));
        return NONE;
      }
    }

    // User-defined function
    const fnEnv = callee.closure.child();
    for (let i = 0; i < callee.params.length; i++) {
      const { name: pn, value: pv } = await resolveParam(callee.params[i], args[i], fnEnv, this);
      fnEnv.set(pn, pv);
    }

    try {
      const result = await this.execBlock(callee.body, fnEnv);
      if (result instanceof ReturnSignal) return result.value;
      return NONE;
    } catch (e) {
      // Propagate runtime errors but set err variable
      this.globals.set('err', e.message ?? String(e));
      return NONE;
    }
  }
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function isTruthy(v) {
  if (v === NONE) return false;
  if (v === false) return false;
  return true;
}

function ivxEqual(a, b) {
  if (a === NONE && b === NONE) return true;
  if (a instanceof Map && b instanceof Map) {
    if (a.size !== b.size) return false;
    for (const [k, v] of a) { if (!ivxEqual(b.get(k), v)) return false; }
    return true;
  }
  if (Array.isArray(a) && Array.isArray(b)) {
    if (a.length !== b.length) return false;
    return a.every((v, i) => ivxEqual(v, b[i]));
  }
  return a === b;
}

function ivxIn(left, right, node) {
  if (right === NONE || right === undefined) return false;
  try {
    if (Array.isArray(right)) return right.some(v => ivxEqual(v, left));
    if (right instanceof Map) return right.has(left);
    if (typeof right === 'string') return String(right).includes(String(left));
  } catch (e) {
    return false;
  }
  return false;
}


// Convert an IVX value to an iterable of [primary, secondary] pairs
function toIterable(value, node) {
  if (typeof value === 'number') {
    if (!Number.isInteger(value) || value < 0) {
      throw new RuntimeError(`'loop <N>' requires a non-negative whole number, got ${value}`, node?.line);
    }
    return Array.from({ length: value }, (_, i) => [i, i]);
  }
  if (Array.isArray(value)) {
    return value.map((v, i) => [v, i]);
  }
  if (value instanceof Map) {
    return [...value.entries()].map(([k, v]) => [k, v]);
  }
  if (typeof value === 'string') {
    return [...value].map((c, i) => [c, i]);
  }
  throw new RuntimeError(`Cannot iterate over ${typeof value}`, node?.line);
}

// Human-readable representation of an IVX value
function ivxRepr(value) {
  if (value === NONE) return 'none';
  if (value === true) return 'yes';
  if (value === false) return 'no';
  if (value instanceof IVXFunction) return `<fun ${value.name}>`;
  if (value instanceof IVXClass) return `<class ${value.name}>`;
  if (value instanceof IVXSuperProxy) return '<super>';
  if (value instanceof Map) {
    const cls = value.get('__class__');
    if (cls) return `<${cls} instance>`;
    const entries = [...value.entries()].filter(([k]) => !String(k).startsWith('__'));
    if (entries.length === 0) return '{}';
    return '{' + entries.map(([k, v]) => `${ivxRepr(k)}: ${ivxRepr(v)}`).join(', ') + '}';
  }
  if (Array.isArray(value)) return '[' + value.map(ivxRepr).join(', ') + ']';
  if (value && typeof value === 'object') return '<object>';
  return String(value);
}

// ── Public API ────────────────────────────────────────────────────────────────
function interpret(source, options = {}) {
  const interp = new Interpreter(options);
  return interp.run(source, options);
}

async function runIVXSelfTests() {
  const results = [];
  const pass = (name, details = {}) => results.push({ name, ok: true, ...details });
  const fail = (name, details = {}) => results.push({ name, ok: false, ...details });

  try {
    const p = parse('make x 1\nsay x');
    if (p.errors.length === 0 && p.ast?.type === 'Program') {
      pass('parse-basic');
    } else {
      fail('parse-basic', { errors: p.errors });
    }
  } catch (e) {
    fail('parse-basic', { error: e.message ?? String(e) });
  }

  try {
    const tc = typecheck('say not_defined_var');
    if (tc.errors.length > 0) {
      pass('typecheck-undefined-var', { count: tc.errors.length });
    } else {
      fail('typecheck-undefined-var', { count: 0 });
    }
  } catch (e) {
    fail('typecheck-undefined-var', { error: e.message ?? String(e) });
  }

  try {
    const tc = typecheck('make t [["name","score"],["Ana",10],["Bo",11]]');
    if (tc.errors.length === 0) {
      pass('typecheck-table-header-exempt');
    } else {
      fail('typecheck-table-header-exempt', { errors: tc.errors.map(e => e.toString()) });
    }
  } catch (e) {
    fail('typecheck-table-header-exempt', { error: e.message ?? String(e) });
  }

  try {
    const out = [];
    await interpret('class Dog\n  fun init(size, name)\n    make self.size size\n    make self.name name\nmake d Dog(3, "Rex")\nsay d.size\nsay d.name', {
      onOutput: (v) => { out.push(v); },
      onError: (e) => { throw e; },
    });
    if (out.length === 2 && out[0] === 3 && out[1] === 'Rex') {
      pass('runtime-class-constructor');
    } else {
      fail('runtime-class-constructor', { output: out });
    }
  } catch (e) {
    fail('runtime-class-constructor', { error: e.message ?? String(e) });
  }

  try {
    const out = [];
    await interpret('class Counter\n  fun init(value)\n    make self.value value\n  fun inc()\n    make self.value self.value + 1\n    give self.value\nmake c Counter(1)\nsay c.inc()\nsay c.inc()', {
      onOutput: (v) => { out.push(v); },
      onError: (e) => { throw e; },
    });
    if (out.length === 2 && out[0] === 2 && out[1] === 3) {
      pass('runtime-class-methods');
    } else {
      fail('runtime-class-methods', { output: out });
    }
  } catch (e) {
    fail('runtime-class-methods', { error: e.message ?? String(e) });
  }

  try {
    const out = [];
    await interpret('class Animal\n  fun init(name)\n    make self.name name\n  fun speak()\n    give self.name\nclass Dog(Animal)\n  fun init(name)\n    make self.name name\n  fun speak()\n    give super.speak() + "!"\nmake d Dog("Rex")\nsay d.speak()\nsay d.name', {
      onOutput: (v) => { out.push(v); },
      onError: (e) => { throw e; },
    });
    if (out.length === 2 && out[0] === 'Rex!' && out[1] === 'Rex') {
      pass('runtime-class-inheritance');
    } else {
      fail('runtime-class-inheritance', { output: out });
    }
  } catch (e) {
    fail('runtime-class-inheritance', { error: e.message ?? String(e) });
  }

  try {
    const out = [];
    await interpret('make x 2\nmake x + 3\nsay x', {
      onOutput: (v) => { out.push(v); },
      onError: (e) => { throw e; },
    });
    if (out.length === 1 && out[0] === 5) {
      pass('runtime-arithmetic-output', { output: out[0] });
    } else {
      fail('runtime-arithmetic-output', { output: out });
    }
  } catch (e) {
    fail('runtime-arithmetic-output', { error: e.message ?? String(e) });
  }

  try {
    const out = [];
    await interpret('make xs [1,2,3]\nsay length(xs)', {
      onOutput: (v) => { out.push(v); },
      onError: (e) => { throw e; },
    });
    if (out.length === 1 && out[0] === 3) {
      pass('runtime-builtin-length', { output: out[0] });
    } else {
      fail('runtime-builtin-length', { output: out });
    }
  } catch (e) {
    fail('runtime-builtin-length', { error: e.message ?? String(e) });
  }

  try {
    const out = [];
    await interpret('make t [["name","score"],["Ana",11],["Bo",22]]\nsay t[A0]\nsay t[B1]', {
      onOutput: (v) => { out.push(v); },
      onError: (e) => { throw e; },
    });
    if (out.length === 2 && out[0] === 'name' && out[1] === 11) {
      pass('runtime-excel-cell-index', { output: out });
    } else {
      fail('runtime-excel-cell-index', { output: out });
    }
  } catch (e) {
    fail('runtime-excel-cell-index', { error: e.message ?? String(e) });
  }

  try {
    const out = [];
    await interpret('make t [["c1","c2","c3"],[11,12,13],[21,22,23],[31,32,33]]\nsay t[A1:B2]\nsay t[2, "B"]', {
      onOutput: (v) => { out.push(v); },
      onError: (e) => { throw e; },
    });
    const okRange = out.length >= 1 && ivxEqual(out[0], [[11, 12], [21, 22]]);
    const okCell = out.length >= 2 && out[1] === 22;
    if (okRange && okCell) {
      pass('runtime-excel-range-index', { output: out });
    } else {
      fail('runtime-excel-range-index', { output: out });
    }
  } catch (e) {
    fail('runtime-excel-range-index', { error: e.message ?? String(e) });
  }

  const total = results.length;
  const passed = results.filter(r => r.ok).length;
  const failed = total - passed;
  const summary = { total, passed, failed, results };
  if (typeof console !== 'undefined') {
    console.log('IVX self-test summary:', summary);
  }
  return summary;
}

if (typeof window !== 'undefined') {
  window.runIVXSelfTests = runIVXSelfTests;
}

</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
<script>
(function () {
  // Monaco's automaticLayout watches its container with a ResizeObserver
  // and calls editor.layout() on change -- which can itself nudge layout
  // dimensions by a pixel and re-trigger within the same frame. When that
  // happens, the ResizeObserver spec's own safety valve throws this
  // exact, extremely well-known message instead of looping forever. It
  // is not a real error -- nothing fails, no state is lost, the editor
  // keeps working -- it just surfaces as an alarming "Uncaught Error" if
  // left unhandled. This is the same targeted suppression used by
  // Cypress, Create React App, Sentry, etc. for this specific message;
  // it does not swallow any other error.
  window.addEventListener('error', (e) => {
    if (e.message && e.message.includes('ResizeObserver loop')) {
      e.stopImmediatePropagation();
      e.preventDefault();
    }
  });

  const consoleEl = document.getElementById('console');
  const runBtn = document.getElementById('runBtn');
  const clearBtn = document.getElementById('clearBtn');
  const micBtn = document.getElementById('micBtn');


  // ── Console rendered as a message thread ────────────────────────────
  function timestamp() {
    const d = new Date();
    return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
  }
  function addMessage(text, kind) {
    const row = document.createElement('div');
    row.className = 'msg ' + kind;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    if (kind === 'info' || kind === 'prompt') {
      row.appendChild(bubble);
    } else {
      const time = document.createElement('div');
      time.className = 'time';
      time.textContent = timestamp();
      row.appendChild(bubble);
      row.appendChild(time);
    }
    consoleEl.appendChild(row);
    consoleEl.scrollTop = consoleEl.scrollHeight;
  }

  // A plain grey rule marking where one Run ends and the next begins --
  // no "Run" text, nobody needs to be told that's what it is.
  function addDivider() {
    const line = document.createElement('div');
    line.className = 'run-divider';
    consoleEl.appendChild(line);
    consoleEl.scrollTop = consoleEl.scrollHeight;
  }

  // 'take <name>' asks for input INLINE, in the console thread, instead of
  // window.prompt() (which blocks the whole tab behind an OS-styled box
  // that looks nothing like the rest of the UI, and on some mobile
  // browsers doesn't reliably show at all). Renders as its own bubble
  // with a text field + Send; resolves once the person answers, and then
  // that bubble freezes into a plain read-only line showing what they typed.
  function addTakePrompt(name) {
    return new Promise((resolve) => {
      const row = document.createElement('div');
      row.className = 'msg prompt';
      const bubble = document.createElement('div');
      bubble.className = 'bubble take-bubble';
      const label = document.createElement('span');
      label.className = 'take-label';
      label.textContent = name;
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'take-input';
      input.autocomplete = 'off';
      input.autocapitalize = 'off';
      input.spellcheck = false;
      const send = document.createElement('button');
      send.type = 'button';
      send.className = 'take-send';
      send.textContent = 'Send';
      bubble.appendChild(label);
      bubble.appendChild(input);
      bubble.appendChild(send);
      row.appendChild(bubble);
      consoleEl.appendChild(row);
      consoleEl.scrollTop = consoleEl.scrollHeight;
      input.focus();

      let answered = false;
      function finish() {
        if (answered) return; // Enter and a click on Send can both fire
        answered = true;
        const val = input.value;
        label.textContent = name + ' \u2192 ' + (val ? val : '(empty)');
        input.remove();
        send.remove();
        row.classList.add('take-answered');
        resolve(val);
      }
      send.addEventListener('click', finish);
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') finish(); });
    });
  }

  clearBtn.addEventListener('click', () => { consoleEl.innerHTML = ''; });

  // ── Console sheet: only shown after Run; closable. Opening it always
  // stops voice recording -- stopVoice is filled in by the voice code
  // below once the recognizer exists.
  const consoleSheet = document.getElementById('consoleSheet');
  const closeConsoleBtn = document.getElementById('closeConsoleBtn');
  let stopVoice = () => {};
  function isConsoleOpen() { return !consoleSheet.hidden; }
  function openConsole() {
    stopVoice();
    consoleSheet.hidden = false;
    document.body.classList.add('console-open');
    closeConsoleBtn.focus({ preventScroll: true });
  }
  function closeConsole() {
    consoleSheet.hidden = true;
    document.body.classList.remove('console-open');
  }
  closeConsoleBtn.addEventListener('click', closeConsole);
  document.getElementById('consoleBackdrop').addEventListener('click', closeConsole);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && isConsoleOpen()) closeConsole();
  });
  // Touch devices: never focus the editor programmatically -- that pops
  // the on-screen keyboard over the code every time recording stops.
  const IS_TOUCH = window.matchMedia('(pointer: coarse)').matches;
  const IS_NARROW = window.matchMedia('(max-width: 600px)').matches;
  // Mobile speech engines return cumulative results -- see onresult.
  const IS_MOBILE_SPEECH = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
    || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); // iPadOS reports as a Mac

  // ── Monaco Editor: loaded from CDN via its own AMD loader, exactly like
  // any real Monaco integration (it is a large multi-file library and
  // can't be inlined as plain JS text the way core.js/runtime.js are).
  // That means this page needs network access the first time it loads.
  //
  // Monaco normally offloads its background language services (folding,
  // word-based suggestions, diffing, etc.) onto a Web Worker. A published
  // artifact page runs under a Content-Security-Policy that restricts
  // which URL schemes may construct a Worker at all -- that's a header
  // set by the hosting origin, not something this page controls, so no
  // amount of picking a different worker-URL scheme from inside the page
  // (blob:, data:, or otherwise) can open a hole through it. Monaco
  // itself detects the failure and falls back to running that same logic
  // on the main thread instead -- which is exactly what the console
  // warning is reporting, not a crash. It's a no-op here regardless: this
  // custom 'vertex' language never registers any of the worker-backed
  // features (no diagnostics, no IntelliSense provider), so there's
  // nothing on that worker to fall back FROM in the first place. Safe to
  // ignore in this hosting context; a self-hosted deployment without that
  // CSP restriction would get the background worker automatically, no
  // code change needed.
  require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' } });
  require(['vs/editor/editor.main'], function () {
    // KEYWORDS is the real keyword set from core.js (inlined in the
    // script tag above) -- the Monarch tokenizer below reads the actual
    // language, not a hand-copied guess, so it can't drift out of sync
    // with what the parser really accepts.
    monaco.languages.register({ id: 'vertex' });

    monaco.languages.setLanguageConfiguration('vertex', {
      brackets: [['(', ')'], ['[', ']'], ['{', '}']],
      autoClosingPairs: [
        { open: '(', close: ')' },
        { open: '[', close: ']' },
        { open: '{', close: '}' },
        { open: '"', close: '"' },
        { open: "'", close: "'" },
      ],
      surroundingPairs: [
        { open: '(', close: ')' },
        { open: '[', close: ']' },
        { open: '{', close: '}' },
        { open: '"', close: '"' },
        { open: "'", close: "'" },
      ],
    });

    monaco.languages.setMonarchTokensProvider('vertex', {
      keywords: Array.from(KEYWORDS),
      tokenizer: {
        root: [
          // 'note' runs to end of line, same as the language's own comment
          // rule (everything from the 'note' word boundary onward).
          [/\bnote\b.*$/, 'comment'],
          [/"([^"\\]|\\.)*"/, 'string'],
          [/'([^'\\]|\\.)*'/, 'string'],
          [/\b\d+(\.\d+)?\b/, 'number'],
          [/[A-Za-z_][A-Za-z0-9_]*/, { cases: { '@keywords': 'keyword', '@default': 'identifier' } }],
        ],
      },
    });

    monaco.editor.defineTheme('vertex-dark', {
      base: 'vs-dark',
      inherit: true,
      rules: [
        { token: 'keyword', foreground: 'ff7b72' },
        { token: 'string', foreground: 'a5d6ff' },
        { token: 'number', foreground: '79c0ff' },
        { token: 'comment', foreground: '6e7681', fontStyle: 'italic' },
      ],
      colors: {
        'editor.background': '#0d1117',
      },
    });

    const editor = monaco.editor.create(document.getElementById('editorContainer'), {
      value: '',
      language: 'vertex',
      theme: 'vertex-dark',
      automaticLayout: true,
      minimap: { enabled: false },
      fontFamily: 'ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace',
      fontSize: 14,
      tabSize: 4,
      insertSpaces: true,
      wordWrap: 'off',
      scrollBeyondLastLine: false,
      // Room under the last line so the floating mic never covers code.
      padding: { top: 8, bottom: 96 },
      // Phones: a slightly larger font and a slimmer gutter.
      ...(IS_NARROW ? {
        fontSize: 15,
        lineNumbersMinChars: 2,
        lineDecorationsWidth: 6,
        glyphMargin: false,
        folding: false,
        renderLineHighlight: 'none',
        overviewRulerLanes: 0,
        overviewRulerBorder: false,
        hideCursorInOverviewRuler: true,
      } : {}),
    });
    // Always '\n' line endings. An EMPTY model otherwise takes the OS
    // default, which on Windows is '\r\n' -- and voice input measures the
    // text it just inserted by string length (one char per '\n'), so on
    // Windows every line break left one stray character behind, and each
    // update piled old fragments up below the cursor. (With the old demo
    // program pre-filled, Monaco detected '\n' from its text instead, which
    // is why this only showed up once the editor started blank.)
    editor.getModel().setEOL(monaco.editor.EndOfLineSequence.LF);

    async function runProgram() {
      openConsole(); // also stops any recording in progress
      runBtn.disabled = true;
      if (consoleEl.children.length > 0) addDivider(); // none before the very first run
      const interp = new Interpreter({
        onOutput: (v) => addMessage(ivxRepr(v), 'out'),
        onError: (e) => addMessage((e && e.message) ? e.message : String(e), 'err'),
        onInput: (name) => addTakePrompt(name),
      });
      try {
        await interp.run(editor.getValue());
      } catch (e) {
        addMessage('Internal error: ' + (e && e.message ? e.message : String(e)), 'err');
      }
      runBtn.disabled = false;
    }

    runBtn.addEventListener('click', runProgram);
    editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter, runProgram);

    // ── Voice input: Chrome's built-in SpeechRecognition (webkitSpeechRecognition).
    // Runs entirely client-side in the browser -- no server, no key.
    //
    // Live updates while speaking need interimResults+continuous on, which
    // means onresult fires repeatedly with Chrome's evolving best guess for
    // the WHOLE utterance so far -- not just the newest word. Naively
    // inserting each guess at "the current cursor" (as a one-shot dictation
    // button reasonably would) stacks guess after guess on top of each
    // other, which is exactly what drifts the cursor out of sync with the
    // text. The fix: snapshot the insertion point ONCE when recording
    // starts, then on every update replace the range this same anchor
    // covers with the newly recomputed text -- so each update REPLACES the
    // live guess in place rather than appending another copy of it.
    const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognizer = null;
    let listening = false;
    let anchorOffset = 0;    // fixed character offset where dictation started
    let lastInsertLen = 0;   // length of the text currently occupying that anchor
    let baseIndentLevel = 0; // indent depth (in 4-space units) of the anchor line
    let committedWordCount = 0; // how many words (from the session's homophone-
                                 // corrected word list) belong to an EARLIER
                                 // anchor segment and should no longer be
                                 // reprocessed against the current one -- see
                                 // the 'line <N>' handling below for why this
                                 // exists instead of restarting the recognizer.
    let firedRunCount = 0;      // how many 'run' words (within the CURRENT
                                 // segment only) have already clicked Run
    let baseOpenStack = [];     // brackets already open at the anchor -- see openBracketsAtOffset
    let baseItName = null;      // what 'it' means at the anchor -- see lastNameBeforeOffset
    let baseFunNames = [];      // functions defined in the editor -- see functionNamesIn
    let firedBackCount = 0;     // how many excess 'back's (CURRENT segment) have
                                 // already deleted a word before the anchor

    if (SpeechRecognitionCtor) {
      micBtn.disabled = false;
    } else {
      micBtn.title = 'Speech recognition not available in this browser (Chrome required)';
    }

    // ── Homophone corrections ────────────────────────────────────────────
    // Chrome's recognizer is tuned for ordinary English, so it reaches for
    // the more common word whenever a coding word sounds like one -- the
    // same problem the reference Nivlahk prototype solves with its own
    // STT_HOMOPHONES table for Python (four->for, some->sum, death->def,
    // ...). That table is meaningless here -- Vertex doesn't have 'for' or
    // 'sum' or 'def' -- so this is a fresh table built around what OUR
    // words actually collide with:
    //   - the editing macros have common-word homophones of their own:
    //     'then' vs 'than', 'so' vs 'sew'/'sow', 'ok' vs 'okay',
    //     'pair' vs 'pear'/'pare'/'pairs'
    //   - the implicit loop counters i/j/k are lone letters, and Chrome
    //     essentially never transcribes a spoken letter as itself -- 'i'
    //     comes back as the pronoun "I", 'j'/'k' come back as "jay"/"kay"
    //   - 'not' (a real keyword) vs its homophone 'knot'
    // ('par', the open-parenthesis macro, and 'pair', the close-parenthesis
    // macro, are NOT cross-mapped here even though they sound similar in
    // fast speech -- doing so would erase the very distinction they exist
    // to make. Same for 'curl'/'index': no evidence yet of a common
    // mis-hearing, so nothing invented for them.)
    // Single-word fixes run per token, checked case-insensitively except
    // for the standalone pronoun "I", which folds to 'i' regardless of
    // case since it's virtually never what someone means while dictating
    // code.
    const WORD_HOMOPHONES = {
      'than': 'then',
      'sew': 'so',
      'sow': 'so',
      'okay': 'ok',
      'pear': 'pair',
      'pare': 'pair',
      'pairs': 'pair',
      'knot': 'not',
      'eye': 'i',
      'aye': 'i',
      'jay': 'j',
      'kay': 'k',
      'too': '2', // never the word 'too' -- always the digit, even inside quotes
    };
    function applyHomophones(transcript) {
      return transcript.split(/\s+/).filter(Boolean).map(w => {
        const trailMatch = /[.,!?;:]+$/.exec(w);
        const suffix = trailMatch ? trailMatch[0] : '';
        const core = suffix ? w.slice(0, w.length - suffix.length) : w;
        if (core === 'I') return 'i' + suffix; // spoken letter 'i' -> loop counter, not the pronoun
        const fix = WORD_HOMOPHONES[core.toLowerCase()];
        return fix ? fix + suffix : w;
      }).join(' ');
    }

    // ── Spoken cardinal numbers ──────────────────────────────────────────
    // "print five" should print 5, not the undefined identifier `five` --
    // this is the same class of problem the reference prototype's homophone
    // table was reaching for with 'to'/'too'/'two' -> '2', just generalized
    // properly instead of covering one digit. Standard word-to-number
    // accumulation: ones/teens add into the current chunk, a ten starts a
    // new chunk, 'hundred'/'thousand' multiply the chunk so far (and
    // 'thousand' flushes it into the running total), and a stray 'and'
    // ("a hundred and five") is skipped when it's actually joining two
    // number words rather than being ordinary text.
    const NUMBER_ONES = {
      zero: 0, one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9,
      ten: 10, eleven: 11, twelve: 12, thirteen: 13, fourteen: 14, fifteen: 15,
      sixteen: 16, seventeen: 17, eighteen: 18, nineteen: 19,
    };
    const NUMBER_TENS = {
      twenty: 20, thirty: 30, forty: 40, fifty: 50, sixty: 60, seventy: 70, eighty: 80, ninety: 90,
    };
    const NUMBER_SCALES = { hundred: 100, thousand: 1000 };

    function numberWordValue(word) {
      if (Object.prototype.hasOwnProperty.call(NUMBER_ONES, word)) return { kind: 'unit', value: NUMBER_ONES[word] };
      if (Object.prototype.hasOwnProperty.call(NUMBER_TENS, word)) return { kind: 'unit', value: NUMBER_TENS[word] };
      if (Object.prototype.hasOwnProperty.call(NUMBER_SCALES, word)) return { kind: 'scale', value: NUMBER_SCALES[word] };
      return null;
    }

    // Consumes as many consecutive number words as possible starting at
    // `startIdx`; returns { value, endIdx } (endIdx is one past the last
    // word consumed) or null if `words[startIdx]` isn't a number word.
    function consumeNumberWords(words, startIdx) {
      let total = 0, chunk = 0, idx = startIdx, consumedAny = false;
      while (idx < words.length) {
        const bare = words[idx].toLowerCase().replace(/[.,!?;:]+$/, '');
        if (bare === 'and') {
          const peek = idx + 1 < words.length ? words[idx + 1].toLowerCase().replace(/[.,!?;:]+$/, '') : null;
          if (consumedAny && peek && numberWordValue(peek)) { idx++; continue; }
          break;
        }
        const info = numberWordValue(bare);
        if (!info) break;
        consumedAny = true;
        if (info.kind === 'scale') {
          chunk = (chunk || 1) * info.value;
          if (info.value >= 1000) { total += chunk; chunk = 0; }
        } else {
          chunk += info.value;
        }
        idx++;
      }
      if (!consumedAny) return null;
      return { value: total + chunk, endIdx: idx };
    }

    // 'line <N>' needs to accept a number however Chrome happened to
    // write it -- as a spelled-out word ("line five", via
    // consumeNumberWords above) or, just as commonly for small numbers,
    // already as a bare digit string ("line 1"). Tries the digit form
    // first since it's a single token; falls back to the word form.
    function consumeLineNumber(words, idx) {
      if (idx < words.length) {
        const bare = words[idx].toLowerCase().replace(/[.,!?;:]+$/, '');
        if (/^\d+$/.test(bare)) return { value: parseInt(bare, 10), endIdx: idx + 1 };
      }
      return consumeNumberWords(words, idx);
    }

    // ── Spoken editing words, replacing the retired 'so'/'then' language
    // shortcuts: those used to be lexer-level syntax (a bare 'so' meant
    // NEWLINE, 'then' meant NEWLINE+INDENT); now that meaning lives here, as
    // something voice input types for you instead of something the
    // language itself has to special-case forever. Two kinds:
    //   TEXT macros -- replaced by literal characters in the buffer:
    //     then -> newline, one indent level deeper
    //     so   -> newline at the current indent level
    //     ok   -> newline, one indent level shallower   (was: 'anyway')
    //     pair -> closes the innermost open bracket -- ) ] or } to match
    //             whatever par/index/curl opened (plain ) if none is open)
    //     back -> deletes the last WORD (one token) -- see applySpokenEditWords
    //     it   -> the last variable/function name mentioned (see lastNameBeforeOffset)
    //     <function name> -> 'name(' ; 'dot <name>' -> '.name(' -- close
    //             with 'pair' (see functionNamesIn)
    //     par  -> an opening parenthesis (
    //     curl -> an opening curly brace {
    //     index -> an opening square bracket [
    //     is   -> = (already meant the same thing as a keyword: "x is 5"
    //             and "x = 5" already parsed identically -- this just
    //             types the symbol form)
    //     more -> >   less -> <   equals -> =   not equals -> !=
    //     plus -> +   minus -> -   times -> *   divided by -> /
    //     mod -> %   power -> ^   (full list: SPOKEN_OPERATORS)
    //     quote ... quote -> wraps everything spoken in between (including
    //       words that would otherwise be macros) in a "double-quoted
    //       string", closed by the next bare 'quote' -- or by 'so' /
    //       'then' / 'ok', which close it and then start the new line
    //     a spoken number ("five", "twenty three", "two thousand six") ->
    //       the digit string Vertex actually parses as a number literal
    //   ACTION macros -- never inserted as text; reported back to the
    //   caller as a side effect instead:
    //     run     -> click the Run button
    //     line <N> -> move the cursor (and voice-dictation anchor) to line N
    //     the <request> -> [DISABLED for now -- see AI_PROMPT_ENABLED]
    //       everything to the end of THIS utterance is
    //       handed to Gemini as a prompt, and its reply becomes the code
    //       (see VERTEX_LANGUAGE_PRIMER and finalizeAiPrompt below) --
    //       genuinely async, unlike every other macro here, since it
    //       waits on a network round trip after the recording stops
    // Applied to the CURRENT anchor segment on every onresult event (not
    // incrementally), so it stays idempotent the same way
    // applyLiveTranscript's range-replace does -- indentation always
    // recomputes from baseIndentLevel, never from a mutated running total.
    // Homophone correction runs first, on the raw transcript, so a
    // misheard trigger word (or loop-counter letter) is fixed before any
    // of this logic ever sees it.
    //
    // Trade-off worth knowing: 'run', 'line', 'pair', 'par', 'curl',
    // 'index', 'back', 'it', 'dot', 'quote', the operator words (SPOKEN_OPERATORS), and any spoken number
    // word are now reserved for voice input specifically ('the' too, when
    // AI_PROMPT_ENABLED is on) -- if you dictate a variable name that
    // happens to be one of them (or a number spelled out), it'll be
    // swallowed as the macro instead of typed literally. Wrapping it in
    // 'quote ... quote' protects it (quoted content is never treated as a
    // macro -- except 'back', which still deletes, and 'so'/'then'/'ok',
    // which close the string and start the new line), and typing by hand
    // always still works.
    // 'the' (when enabled) is the sharpest edge of the bunch: it consumes the REST of the
    // recording once triggered, so you can't dictate more code after it in
    // the same session -- stop and start the mic again for the next line.
    function indentLevelAtOffset(model, offset) {
      const pos = model.getPositionAt(offset);
      const lineContent = model.getLineContent(pos.lineNumber);
      const upto = lineContent.slice(0, pos.column - 1);
      const m = /^ */.exec(upto);
      return Math.floor(m[0].length / 4);
    }

    // Operates on `words` (already homophone-corrected and SLICED to just
    // the current anchor segment -- see committedWordCount above) rather
    // than a raw transcript string. Stops the instant it hits a resolved
    // 'line <N>' command: everything after that point belongs to a NEW
    // anchor (the destination line), and the caller advances
    // committedWordCount and re-anchors before the next onresult event
    // reprocesses the remainder fresh -- rather than this call guessing
    // where the rest should go.
    // ── Open-bracket scan for 'pair' ─────────────────────────────────────
    // 'pair' used to always type ')', so "index 0 pair" produced '[0)'.
    // Now 'pair' closes whatever bracket is actually open, innermost first.
    // Vertex brackets never span lines (the lexer tracks no bracket depth
    // across NEWLINE), so the brackets already open at the anchor are
    // found by scanning just the anchor line up to the anchor --
    // skipping string contents and a trailing 'note' comment. That picks
    // up brackets typed by hand or dictated in an earlier recording too,
    // not just ones opened in this utterance.
    const CLOSER_FOR = { '(': ')', '[': ']', '{': '}' };
    function openBracketsAtOffset(model, offset) {
      const pos = model.getPositionAt(offset);
      const text = model.getLineContent(pos.lineNumber).slice(0, pos.column - 1);
      const stack = [];
      let quoteCh = null;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (quoteCh) {
          if (c === '\\') { i++; continue; }
          if (c === quoteCh) quoteCh = null;
          continue;
        }
        if (c === '"' || c === "'") { quoteCh = c; continue; }
        if (text.startsWith('note ', i) && (i === 0 || /\s/.test(text[i - 1]))) break;
        if (CLOSER_FOR[c]) stack.push(CLOSER_FOR[c]);
        else if ((c === ')' || c === ']' || c === '}') && stack[stack.length - 1] === c) stack.pop();
      }
      return stack;
    }

    // ── Spoken operators ─────────────────────────────────────────────────
    // Each pattern is a word sequence (a trailing '?' would mark an
    // optional word); the LONGEST matching pattern wins, so "not equals"
    // is one '!=' rather than 'not' followed by '='.
    const SPOKEN_OPERATORS = [
      ['!=', ['not', 'equals']],
      ['!=', ['does', 'not', 'equal']],
      ['>',  ['more']],
      ['<',  ['less']],
      ['=',  ['equals']],
      ['=',  ['is']],
      ['+',  ['plus']],
      ['-',  ['minus']],
      ['*',  ['times']],
      ['*',  ['multiplied', 'by']],
      ['/',  ['divided', 'by?']],
      ['%',  ['mod']],
      ['%',  ['modulo']],
      ['^',  ['power']],
    ];
    function matchSpokenOperator(words, idx) {
      const bareAt = (i) => (i < words.length ? words[i].toLowerCase().replace(/[.,!?;:]+$/, '') : null);
      let best = null;
      for (const [op, pattern] of SPOKEN_OPERATORS) {
        let i = idx, ok = true;
        for (const part of pattern) {
          const optional = part.endsWith('?');
          const want = optional ? part.slice(0, -1) : part;
          const got = bareAt(i);
          if (got === want) i++;
          else if (!optional) { ok = false; break; }
        }
        if (ok && i > idx && (!best || i > best.endIdx)) best = { op, endIdx: i };
      }
      return best;
    }

    // ── 'it' -> the last variable or named thing ─────────────────────────
    // Like English "it": the most recently MENTIONED name -- a variable,
    // function, parameter, class... anything that isn't a keyword, number,
    // string or comment. "make total zero so loop ten then make it plus I"
    // types 'make total + i'. The antecedent is tracked as words are
    // spoken; at the start of a recording (or after a 'line <N>' jump) it
    // comes from the code already in the editor before the cursor. With
    // no name anywhere before it, 'it' is typed literally.
    const IDENT_RE = /^[A-Za-z_]\w*$/;
    function isNameWord(word) {
      return IDENT_RE.test(word) && !KEYWORDS.has(word.toLowerCase());
    }
    function lastNameBeforeOffset(model, offset) {
      const text = model.getValue().slice(0, offset);
      const re = /"""[\s\S]*?(?:"""|$)|'''[\s\S]*?(?:'''|$)|"(?:\\.|[^"\\\n])*"?|'(?:\\.|[^'\\\n])*'?|\bnote\b[^\n]*|[A-Za-z_]\w*/g;
      let last = null, m;
      while ((m = re.exec(text))) {
        if (isNameWord(m[0])) last = m[0];
      }
      return last;
    }

    // ── Auto-inserted call parens ────────────────────────────────────────
    // Saying a function's name types 'name(' and owes a ')' to 'pair', so
    // "print double total pair" -> 'print double(total)' with no 'par'
    // (which Chrome mishears too easily). A function name is any name
    // defined with 'fun' anywhere in the editor, or earlier in the same
    // recording; the name right after 'fun' opens its parameter list the
    // same way ("fun double put pair then" -> 'fun double(put)').
    // 'dot <name>' does the same for a method: "list dot push x pair" ->
    // 'list.push(x)'. If you say 'par' anyway right after one of these,
    // it's absorbed rather than doubling the paren.
    // Voice commands that should still work right after 'dot' rather than
    // being taken as the method name.
    const DOT_NOT_METHOD = new Set(['back', 'pair', 'par', 'quote', 'then', 'so', 'ok', 'run']);
    function functionNamesIn(text) {
      const names = [];
      const re = /"""[\s\S]*?(?:"""|$)|'''[\s\S]*?(?:'''|$)|"(?:\\.|[^"\\\n])*"?|'(?:\\.|[^'\\\n])*'?|\bnote\b[^\n]*|\bfun[ \t]+([A-Za-z_]\w*)/g;
      let m;
      while ((m = re.exec(text))) if (m[1]) names.push(m[1]);
      return names;
    }
    // Every function defined in the editor OUTSIDE the live dictation span.
    function functionNamesOutsideLive() {
      const text = editor.getModel().getValue();
      return functionNamesIn(text.slice(0, anchorOffset) + '\n' + text.slice(anchorOffset + lastInsertLen));
    }

    // 'the <request>' (dictate a request to Gemini) is switched off until
    // the API is working -- with this false, 'the' is an ordinary word
    // again. The Gemini code below is kept intact; flip this to re-enable.
    const AI_PROMPT_ENABLED = false;

    // Builds the segment as a list of emitted TOKENS rather than one
    // string, each carrying the full editing state right after it
    // (indent, quote, open brackets...). That's what makes 'back' exact:
    // popping a token restores the state before it, so backing over a
    // 'then' also undoes its indent, backing over 'par' un-opens the
    // bracket, and so on. 'back' deletes one WORD (one token) per use --
    // a newline macro counts as one token, so it rejoins the line rather
    // than deleting it. When there's nothing left in this segment to pop,
    // the extra 'back's are returned as excessBacks and the caller
    // deletes that many words from the text BEFORE the anchor.
    function applySpokenEditWords(words, baseIndentLevel, baseOpenStack, baseItName, baseFunNames) {
      const initialState = {
        indent: baseIndentLevel,
        atLineStart: false, // just emitted a newline -- no leading space before the next word
        quoteOpen: false,
        stack: (baseOpenStack || []).slice(), // closers still owed, innermost last
        hasOutput: false,
        it: baseItName || null, // what 'it' currently refers to
        funs: baseFunNames || [], // names that auto-open a '(' when spoken
        afterFun: false,     // last token was the keyword 'fun'
        autoParen: false,    // last token ended in an auto-inserted '('
      };
      const tokens = [];
      let st = initialState;
      const emit = (text, changes) => {
        st = Object.assign({}, st, { atLineStart: false, hasOutput: true, afterFun: false, autoParen: false }, changes);
        tokens.push({ text, after: st });
      };
      const sp = () => (st.hasOutput && !st.atLineStart ? ' ' : '');
      // A name: a known function (or the name being defined right after
      // 'fun') becomes 'name(' -- glued to its first argument, with ')'
      // owed to 'pair'. Any other name is typed as-is. Either way it
      // becomes what 'it' refers to.
      const emitName = (name) => {
        if (st.afterFun || st.funs.includes(name)) {
          emit(sp() + name + '(', {
            it: name,
            funs: st.funs.includes(name) ? st.funs : st.funs.concat(name),
            stack: st.stack.concat(')'),
            atLineStart: true, // no space between '(' and the first argument
            autoParen: true,
          });
        } else {
          emit(sp() + name, { it: name });
        }
      };
      let excessBacks = 0;
      let opMatch = null;
      let runCount = 0;
      let gotoLine = null; // { line, wordsConsumed } once a 'line <N>' resolves
      let aiPrompt = null; // the words after 'the', once triggered -- see below
      for (let idx = 0; idx < words.length; idx++) {
        const w = words[idx];
        // Strip trailing punctuation only to RECOGNIZE the trigger word
        // (Chrome sometimes appends it); the word itself is still emitted
        // verbatim when it's not a trigger, punctuation and all.
        const bare = w.toLowerCase().replace(/[.,!?;:]+$/, '');

        // 'back' works everywhere, including inside an open quote, so a
        // misheard word in a string can be fixed without closing it.
        if (bare === 'back') {
          if (tokens.length > 0) {
            tokens.pop();
            st = tokens.length > 0 ? tokens[tokens.length - 1].after : initialState;
          } else {
            excessBacks++;
          }
          continue;
        }

        // A newline macro ('so', 'then', 'ok') while a quote is open also
        // ends the string: the closing '"' is typed first, as its own
        // token (so one 'back' removes just the newline, a second the
        // quote mark), then the newline is handled normally below.
        const isNewlineMacro = bare === 'so' || bare === 'then' || bare === 'ok';
        if (st.quoteOpen && isNewlineMacro) {
          emit('"', { quoteOpen: false });
        }

        // Inside an open quote, every other word is literal string content
        // -- including words that would otherwise be macros ('run', 'pair',
        // a number...) -- until the matching closing 'quote'.
        if (st.quoteOpen && bare !== 'quote') {
          emit(sp() + w);
          continue;
        }

        if (bare === 'quote') {
          if (!st.quoteOpen) {
            // no space between the opening quote and the first word inside
            emit(sp() + '"', { quoteOpen: true, atLineStart: true });
          } else {
            emit('"', { quoteOpen: false });
          }
          continue;
        }

        const numberMatch = consumeNumberWords(words, idx);
        if (numberMatch) {
          emit(sp() + String(numberMatch.value));
          idx = numberMatch.endIdx - 1; // for-loop's idx++ lands on the next unconsumed word
          continue;
        }

        if (bare === 'then') {
          const indent = st.indent + 1;
          emit('\n' + '    '.repeat(indent), { indent, atLineStart: true });
        } else if (bare === 'so') {
          // New line at the CURRENT indent level ('ok' is the dedent).
          emit('\n' + '    '.repeat(st.indent), { atLineStart: true });
        } else if (bare === 'ok') {
          const indent = Math.max(0, st.indent - 1);
          emit('\n' + '    '.repeat(indent), { indent, atLineStart: true });
        } else if (bare === 'pair') {
          // Close the innermost open bracket; plain ')' if none is open.
          const closer = st.stack.length > 0 ? st.stack[st.stack.length - 1] : ')';
          emit(closer, { stack: st.stack.slice(0, -1) });
        } else if (bare === 'par' && st.autoParen) {
          // '(' was already auto-inserted -- don't double it.
        } else if (bare === 'dot' && idx + 1 < words.length && IDENT_RE.test(words[idx + 1].replace(/[.,!?;:]+$/, ''))
                   && !DOT_NOT_METHOD.has(words[idx + 1].toLowerCase().replace(/[.,!?;:]+$/, ''))) {
          // 'dot <name>' -> '.name(' glued to what came before; ')' owed to 'pair'.
          const method = words[idx + 1].replace(/[.,!?;:]+$/, '');
          emit('.' + method + '(', { stack: st.stack.concat(')'), atLineStart: true, autoParen: true });
          idx++;
        } else if (bare === 'par' || bare === 'curl' || bare === 'index') {
          const opener = bare === 'par' ? '(' : bare === 'curl' ? '{' : '[';
          emit(opener, { stack: st.stack.concat(CLOSER_FOR[opener]) });
        } else if ((opMatch = matchSpokenOperator(words, idx))) {
          // Spoken operator ('plus', 'equals', 'is less than or equal to'...)
          // -> the symbol, spaced like an ordinary binary operator. See
          // SPOKEN_OPERATORS above.
          emit(sp() + opMatch.op);
          idx = opMatch.endIdx - 1;
        } else if (bare === 'it' && st.it) {
          emitName(st.it);
        } else if (bare === 'run') {
          runCount++;
        } else if (bare === 'line' && consumeLineNumber(words, idx + 1)) {
          // Only a command when immediately followed by a number -- "line
          // 5" or "line five" both work, since Chrome sometimes writes
          // small numbers as digits and sometimes spells them out.
          // Otherwise 'line' is just an ordinary word (falls through to
          // the plain-word branch below). If the number hasn't landed YET
          // (still mid-utterance), 'line' is typed as literal text for now
          // and silently replaced once it does -- the next onresult event
          // reprocesses the segment from scratch, same as any other
          // in-progress guess.
          const lineMatch = consumeLineNumber(words, idx + 1);
          gotoLine = { line: lineMatch.value, wordsConsumed: lineMatch.endIdx };
          break; // stop here -- see the big comment on this function
        } else if (bare === 'the' && AI_PROMPT_ENABLED) {
          // Everything from here to the end of THIS utterance is an AI
          // prompt, not code -- "fun the best way to make a RGB color
          // function" means: type 'fun', then hand "best way to make a
          // RGB color function" to Gemini and drop its answer in. Uses the
          // ORIGINAL words (not lowercased/punctuation-stripped) since
          // this is natural language for a model, not a macro to match.
          // Grows on every onresult call as more speech arrives, same as
          // any other in-progress guess -- the caller only treats it as
          // FINAL once the recognition session actually ends.
          aiPrompt = words.slice(idx + 1).join(' ');
          break;
        } else {
          // Vertex keywords are lowercase-only, so a capitalized one
          // ("Loop", "Print" -- Chrome capitalizes after what it thinks is
          // a sentence break) is folded to lowercase. Other words keep
          // their case.
          const typed = KEYWORDS.has(bare) ? w.toLowerCase() : w;
          if (isNameWord(typed)) emitName(typed);
          else emit(sp() + typed, bare === 'fun' ? { afterFun: true } : {});
        }
      }
      const text = tokens.map(t => t.text).join('');
      return { text, runCount, gotoLine, aiPrompt, excessBacks };
    }

    // One 'back' with nothing left in the current segment: delete the word
    // just before `offset` in the editor, the way Ctrl+Backspace would --
    // trailing spaces plus one word (or one bracket/quote/comma, or one
    // operator run like '>='), leaving the space BEFORE that word so the
    // next dictated word lands cleanly. If only indentation sits before
    // the cursor, that indentation and the line break count as the "word"
    // -- the line is joined onto the one above, never deleted wholesale.
    // Returns the new (smaller) offset where that text used to start.
    function deleteWordBefore(offset) {
      const model = editor.getModel();
      const pos = model.getPositionAt(offset);
      const lineText = model.getLineContent(pos.lineNumber).slice(0, pos.column - 1);
      let startOffset;
      if (lineText.trim() === '') {
        if (pos.lineNumber === 1) {
          startOffset = offset - lineText.length; // just clear the indentation
        } else {
          const prev = pos.lineNumber - 1;
          startOffset = model.getOffsetAt({ lineNumber: prev, column: model.getLineMaxColumn(prev) });
        }
      } else {
        const m = /(\w+|[()\[\]{}"',]|[^\w\s()\[\]{}"',]+)[ \t]*$/.exec(lineText);
        startOffset = offset - (m ? m[0].length : 0);
      }
      if (startOffset >= offset) return offset;
      const s = model.getPositionAt(startOffset);
      const range = new monaco.Range(s.lineNumber, s.column, pos.lineNumber, pos.column);
      editor.executeEdits('voice-input', [{ range, text: '', forceMoveMarkers: true }]);
      return startOffset;
    }

    function applyLiveTranscript(transcript) {
      const model = editor.getModel();
      const startPos = model.getPositionAt(anchorOffset);
      const endPos = model.getPositionAt(anchorOffset + lastInsertLen);
      const range = new monaco.Range(startPos.lineNumber, startPos.column, endPos.lineNumber, endPos.column);
      editor.executeEdits('voice-input', [{ range, text: transcript, forceMoveMarkers: true }]);
      lastInsertLen = transcript.length;
      const newPos = model.getPositionAt(anchorOffset + transcript.length);
      editor.setPosition(newPos);
      editor.revealPositionInCenterIfOutsideViewport(newPos);
    }

    function stopListening() {
      listening = false;
      micBtn.classList.remove('listening');
      micBtn.setAttribute('aria-pressed', 'false');
      micBtn.setAttribute('aria-label', 'Start voice input');
      if (!IS_TOUCH) editor.focus();
    }

    // Re-anchors live dictation to a new offset, for a NEW segment within
    // the SAME recognition session (see committedWordCount above).
    function reanchorAt(offset) {
      const model = editor.getModel();
      anchorOffset = offset;
      lastInsertLen = 0;
      baseIndentLevel = indentLevelAtOffset(model, anchorOffset);
      baseOpenStack = openBracketsAtOffset(model, anchorOffset);
      baseItName = lastNameBeforeOffset(model, anchorOffset);
      baseFunNames = functionNamesOutsideLive();
      firedBackCount = 0;
    }

    // ── 'the <request>' -> ask Gemini Flash to write the Vertex code, and
    // drop its answer in. This page has no server, so the key below is
    // embedded directly in this file at the person's explicit request --
    // it ships in plain text with every copy of vertex.html (view-source,
    // anyone it's sent to, any place it's published). Swap GEMINI_API_KEY
    // to change or revoke it; there is no other copy of it in this project.
    //
    // Gemini has never seen Vertex, so asking it to "write Vertex code"
    // with no context would just produce hallucinated syntax (probably
    // Python). VERTEX_LANGUAGE_PRIMER gives it a compact cheat-sheet
    // first -- its vocabulary pulled from the real KEYWORDS set (same
    // single-source-of-truth rule as the syntax highlighter), plus a
    // short hand-written grammar sketch, since the shape of the grammar
    // isn't something a keyword list encodes.
    const GEMINI_MODEL = 'gemini-2.0-flash'; // swap this if a newer Flash model name exists by the time you're reading this
    const GEMINI_API_KEY = 'AQ.Ab8RN6K7g_4yT0_4KmcsG9om994wHG7b50G-3CiovLojD4w3ew'; // embedded per explicit instruction -- see comment above
    const VERTEX_LANGUAGE_PRIMER = [
      'You write code in Vertex, a small indentation-based programming language (like Python, but with its own keywords and no colons -- blocks are marked by 4-space indentation).',
      'Its full keyword vocabulary is: ' + Array.from(KEYWORDS).join(', ') + '.',
      'Core syntax:',
      '  make <name> <expr>        -- declare or assign a variable',
      '  if <cond>  /  else        -- conditional (indented body)',
      '  while <cond>              -- loop while a condition holds',
      '  loop <n>                  -- repeat n times; implicit counter i (nested loops use ii, j, jj, k, kk)',
      '  loop <item> in <list>     -- iterate a list',
      '  print <expr>              -- print to the console',
      '  say <expr>                -- speak text aloud',
      '  take <name>               -- read user input into a variable',
      '  fun <name>(<params>)      -- define a function; give <value> returns from it',
      '  class <Name>              -- define a class; init is its constructor, super refers to the parent',
      'Comparisons: = != < > <= >= is (is means the same thing as =). Logic: and or not same.',
      'Strings use double quotes. Lists use [1, 2, 3]. Comments start with note and run to the end of the line.',
      'Example:',
      '  make total 0',
      '  loop 5',
      '      make total total + i',
      '      print total',
      'Reply with ONLY Vertex code -- no explanation, no markdown code fences.',
    ].join('\n');

    async function callGeminiForCode(prompt) {
      if (!GEMINI_API_KEY) return { error: 'no Gemini API key configured (GEMINI_API_KEY is empty)' };
      const url = 'https://generativelanguage.googleapis.com/v1beta/models/' + GEMINI_MODEL
        + ':generateContent?key=' + encodeURIComponent(GEMINI_API_KEY);
      const body = {
        system_instruction: { parts: [{ text: VERTEX_LANGUAGE_PRIMER }] },
        contents: [{ parts: [{ text: 'Write Vertex code for this request: ' + prompt }] }],
        generationConfig: { temperature: 0.3, maxOutputTokens: 512 },
      };
      let res;
      try {
        res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
      } catch (e) {
        return { error: 'network error: ' + (e && e.message ? e.message : String(e)) };
      }
      if (!res.ok) {
        const errText = await res.text().catch(() => '');
        return { error: 'HTTP ' + res.status + (errText ? ': ' + errText.slice(0, 200) : '') };
      }
      let data;
      try { data = await res.json(); } catch (e) { return { error: 'could not parse Gemini response' }; }
      const text = data && data.candidates && data.candidates[0]
        && data.candidates[0].content && data.candidates[0].content.parts
        && data.candidates[0].content.parts[0] && data.candidates[0].content.parts[0].text;
      if (!text) return { error: 'empty response from Gemini' };
      // Strip a markdown fence if the model added one despite being asked not to.
      const code = text.trim().replace(/^```[a-zA-Z]*\n?/, '').replace(/```\s*$/, '').trim();
      return { code };
    }

    // Called once the recognition session that captured a 'the <request>'
    // has actually ended (see recognizer.onend below). The placeholder
    // text is already sitting in the editor at [anchorOffset,
    // anchorOffset+lastInsertLen) from the live-preview updates -- but the
    // network call takes real time, during which the person could keep
    // typing or start a new recording elsewhere in the file, which would
    // shift or invalidate a plain offset. A Monaco decoration tracks that
    // span through any such edits, so the eventual replacement lands in
    // the right place (or is safely skipped if that span got deleted
    // entirely in the meantime).
    function finalizeAiPrompt(prompt) {
      const model = editor.getModel();
      const startPos = model.getPositionAt(anchorOffset);
      const endPos = model.getPositionAt(anchorOffset + lastInsertLen);
      const range = new monaco.Range(startPos.lineNumber, startPos.column, endPos.lineNumber, endPos.column);
      const [decorationId] = editor.deltaDecorations([], [{ range, options: {} }]);

      addMessage('Asking Gemini: ' + (prompt || '(empty request)'), 'info');
      callGeminiForCode(prompt).then((result) => {
        const currentRange = model.getDecorationRange(decorationId);
        editor.deltaDecorations([decorationId], []);
        if (!currentRange) return; // the placeholder text is gone -- nothing sane to replace
        const replacement = result.code ? result.code : '/* AI request failed: ' + result.error + ' */';
        editor.executeEdits('ai-codegen', [{ range: currentRange, text: replacement, forceMoveMarkers: true }]);
        addMessage(result.code ? 'Gemini responded.' : 'Gemini request failed: ' + result.error, result.code ? 'info' : 'err');
