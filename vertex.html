      });
    }

    let pendingAiPrompt = null; // the AI prompt captured so far this segment, or null if none is in progress

    // Lets openConsole() stop recording. recognizer.stop() lets the last
    // words land and then fires onend (which resets the button); the UI
    // is reset right away too so the mic never looks live under the sheet.
    stopVoice = () => {
      if (listening && recognizer) {
        recognizer.stop();
        stopListening();
      }
    };

    micBtn.addEventListener('click', () => {
      if (listening) { recognizer && recognizer.stop(); return; }
      if (isConsoleOpen()) return; // never record while the console is showing
      recognizer = new SpeechRecognitionCtor();
      recognizer.lang = 'en-US';
      recognizer.continuous = true;
      recognizer.interimResults = true;

      reanchorAt(editor.getModel().getOffsetAt(editor.getPosition()));
      committedWordCount = 0;
      firedRunCount = 0;
      pendingAiPrompt = null;

      recognizer.onresult = (e) => {
        // e.results holds every result (finalized and in-progress) since
        // this recognition session started -- concatenating all of them
        // each time gives the full word history. Words already committed
        // to an earlier anchor segment (committedWordCount) are sliced
        // off before processing, so this only ever recomputes the CURRENT
        // segment, against the CURRENT anchor -- which is what keeps
        // every update idempotent even across a mid-recording 'line <N>'
        // jump. Earlier drafts of this handled a line-jump by stopping
        // and restarting the SpeechRecognition object itself (to get a
        // clean e.results), but constructing a brand new recognizer
        // turned out to re-trigger the browser's microphone permission
        // prompt on every single jump -- so the anchor now moves without
        // ever touching the recognizer at all.
        let transcript = '';
        // Chrome capitalizes the first word of every result chunk as if it
        // started a sentence ("Loop ten", "Total plus one") -- which turns
        // keywords and variable names into different identifiers. So the
        // first word of each chunk is lowercased when it's plain Title-case
        // (all-caps like 'RGB' is left alone). Chunks are also joined with
        // a space, since some platforms don't start chunks with one and the
        // last word of one chunk would glue onto the first of the next.
        //
        // Mobile Chrome (Android, and iOS) doesn't split results the way
        // desktop does: each new result REPEATS everything heard so far
        // ("make", "make total", "make total zero"...). Concatenating them
        // re-types the whole utterance on every word. So on mobile, a
        // result whose words start with everything collected so far (or
        // with the previous result) REPLACES that text instead of adding
        // to it. Desktop keeps plain concatenation -- there, two separate
        // results that happen to start alike ("print x", "print x plus
        // one") are genuinely two things said.
        const parts = [];
        const wordsOf = (t) => t.toLowerCase().replace(/[.,!?;:]/g, '').split(/\s+/).filter(Boolean);
        const startsWithWords = (a, b) => b.length > 0 && b.length <= a.length && b.every((w, k) => a[k] === w);
        for (let i = 0; i < e.results.length; i++) {
          const chunk = e.results[i][0].transcript.trim().replace(/^([A-Z][a-z]+)\b/, (m, word) => word.toLowerCase());
          if (!chunk) continue;
          if (IS_MOBILE_SPEECH && parts.length > 0) {
            const w = wordsOf(chunk);
            if (startsWithWords(w, wordsOf(parts.join(' ')))) { parts.length = 0; parts.push(chunk); continue; }
            const last = wordsOf(parts[parts.length - 1]);
            if (startsWithWords(w, last)) { parts[parts.length - 1] = chunk; continue; }
            if (startsWithWords(last, w)) continue; // a shorter repeat of what's already there
          }
          parts.push(chunk);
        }
        transcript = parts.join(' ');
        const allWords = applyHomophones(transcript).split(/\s+/).filter(Boolean);
        const segmentWords = allWords.slice(committedWordCount);
        let result = applySpokenEditWords(segmentWords, baseIndentLevel, baseOpenStack, baseItName, baseFunNames);
        if (result.excessBacks > firedBackCount) {
          // 'back' with nothing left in this segment eats words BEFORE the
          // anchor. Like 'run', each one fires once (tracked by
          // firedBackCount) even though the segment is reprocessed on every
          // update. The live text moves left along with the anchor, and the
          // indent/bracket context is re-read, since the deleted word could
          // have been a '(' or a line break. The segment is then re-rendered
          // against that fresh context.
          for (let n = firedBackCount; n < result.excessBacks; n++) {
            anchorOffset = deleteWordBefore(anchorOffset);
          }
          firedBackCount = result.excessBacks;
          const model = editor.getModel();
          baseIndentLevel = indentLevelAtOffset(model, anchorOffset);
          baseOpenStack = openBracketsAtOffset(model, anchorOffset);
          baseItName = lastNameBeforeOffset(model, anchorOffset);
          baseFunNames = functionNamesOutsideLive();
          result = applySpokenEditWords(segmentWords, baseIndentLevel, baseOpenStack, baseItName, baseFunNames);
        }
        const { text, runCount, gotoLine, aiPrompt } = result;
        if (aiPrompt !== null) {
          // Still accumulating -- 'the' truncated `text` right where it
          // started, so show a live placeholder appended after it. This is
          // NOT yet the real request; that only fires from onend, once the
          // utterance genuinely ends (see the design discussion above).
          pendingAiPrompt = aiPrompt;
          applyLiveTranscript(text + '/* \u{1F916} asking Gemini: ' + aiPrompt + '… */');
        } else {
          pendingAiPrompt = null;
          applyLiveTranscript(text);
        }
        if (runCount > firedRunCount) {
          for (let i = firedRunCount; i < runCount; i++) runProgram();
          firedRunCount = runCount;
        }
        if (gotoLine) {
          const model = editor.getModel();
          const line = Math.max(1, Math.min(gotoLine.line, model.getLineCount()));
          const pos = { lineNumber: line, column: 1 };
          editor.setPosition(pos);
          editor.revealLineInCenter(line);
          committedWordCount += gotoLine.wordsConsumed;
          firedRunCount = 0; // fresh segment -- its own run-count starts over
          reanchorAt(model.getOffsetAt(pos));
          // Anything spoken after 'line <N>' in this same burst is still
          // sitting in `transcript`, past committedWordCount now -- the
          // next onresult event (already on its way, since Chrome keeps
          // streaming) reprocesses it fresh against the new anchor.
        }
      };
      recognizer.onerror = (e) => {
        // 'no-speech' fires often and isn't really an error worth surfacing
        // -- Chrome just means "nothing heard yet," and onend follows anyway.
        if (e.error !== 'no-speech') addMessage('Voice input error: ' + e.error, 'err');
      };
      recognizer.onend = () => {
        if (pendingAiPrompt !== null) {
          const prompt = pendingAiPrompt;
          pendingAiPrompt = null;
          finalizeAiPrompt(prompt);
        }
        stopListening();
      };
      listening = true;
      micBtn.classList.add('listening');
      micBtn.setAttribute('aria-pressed', 'true');
      micBtn.setAttribute('aria-label', 'Stop voice input');
      try {
        recognizer.start();
      } catch (e) {
        addMessage('Could not start voice input: ' + (e && e.message ? e.message : String(e)), 'err');
        stopListening();
      }
    });

  });
})();
</script>
</body>
</html>
